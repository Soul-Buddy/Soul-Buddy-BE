spring:
  profiles:
    active: local
  application:
    name: soul-buddy
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    org.hibernate: ERROR
    com.soulbuddy: DEBUG

server:
  port: ${SERVER_PORT:8080}

clova:
  api-key: ${CLOVA_API_KEY}
  host: ${CLOVA_HOST:https://clovastudio.stream.ntruss.com}
  timeout-seconds: 30
  max-retries: 2
  request-id:
    persona-friend: ${CLOVA_REQUEST_ID_PERSONA_FRIEND:c91d3c49132a4ea099b9d5e1621d061b}
    persona-counselor: ${CLOVA_REQUEST_ID_PERSONA_COUNSELOR:d55c5205fc904a658869e1a784890db2}
    # 2026-05-17: EMOTION ft (a3rer2me) 적용. 다른 4종(persona/risk/intervention) 은 base 유지.
    classify-emotion: ${CLOVA_REQUEST_ID_CLASSIFY_EMOTION:59df544bebf94cf887edebe996621e13}
    classify-risk: ${CLOVA_REQUEST_ID_CLASSIFY_RISK:f37e452b8e9f4731b2a68e11b3cdb960}
    classify-intervention: ${CLOVA_REQUEST_ID_CLASSIFY_INTERVENTION:edaf62fa2a674e93bde2402110b203ab}
    summary: ${CLOVA_REQUEST_ID_SUMMARY:65a1b604dcd049b1b8abf221768db7a5}
    summarization: ${CLOVA_REQUEST_ID_SUMMARIZATION:20a826df073d4b67a31771f2d96f1746}
    rag-reasoning: ${CLOVA_REQUEST_ID_RAG_REASONING:d2914e6895b947b590e81387fbba86fd}
  endpoint:
    persona-friend: ${CLOVA_HCX005_FRIEND_ENDPOINT:/v3/chat-completions/HCX-005}
    persona-counselor: ${CLOVA_HCX005_COUNSELOR_ENDPOINT:/v3/chat-completions/HCX-005}
    summary: ${CLOVA_HCX007_ENDPOINT:/v3/chat-completions/HCX-007}
    classify-emotion: ${CLOVA_DASH002_EMOTION_ENDPOINT:/v3/tasks/a3rer2me/chat-completions}
    classify-risk: ${CLOVA_DASH002_RISK_ENDPOINT:/v3/chat-completions/HCX-DASH-002}
    classify-intervention: ${CLOVA_DASH002_INTERVENTION_ENDPOINT:/v3/chat-completions/HCX-DASH-002}
    summarization: ${CLOVA_SUMMARIZATION_ENDPOINT:/v1/api-tools/summarization/v2}
    rag-reasoning: ${CLOVA_RAG_REASONING_ENDPOINT:/v1/api-tools/rag-reasoning}

soulbuddy:
  prompt:
    system-prompts-path: ${SYSTEM_PROMPTS_PATH:classpath:prompts/system_prompts_final.txt}
  safety:
    forced-safety-threshold: 3
    counseling-center-path: ${COUNSELING_CENTER_PATH:/counseling-center}
  in-session-summary:
    threshold: 80         # USER+ASSISTANT 합산 메시지 수 ≥ 이 값일 때 압축 트리거 (PR-2 v2.3)
    batch-size: 20        # 압축 단위 (가장 오래된 메시지 N개를 한 번에 압축)
  rag:
    enabled: ${RAG_ENABLED:true}                                  # PR-6: 세션 간 기억 RAG 활성화
    top-k: ${RAG_TOP_K:2}                                         # 검색 결과 Top-N (사용자 결정: 2)
    min-query-length: ${RAG_MIN_QUERY_LENGTH:2}                   # 너무 짧은 query 무시 (오답 인용 방지)
    trigger-keywords: ${RAG_TRIGGER_KEYWORDS:기억나,지난번,예전에,말했던,얘기했던,저번에,그때,예전,지난}

jwt:
  secret: ${JWT_SECRET:soul-buddy-default-jwt-secret-please-change-me-32bytes-minimum}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
